name: tests

# Continuous verification of the zoom math, menu structure, dark mode wiring
# and localization alignment invariants. Runs on every push (branches and
# tags) and every pull request.
#
# The daily schedule (04:00 UTC = 12:00 Asia/Shanghai) intentionally runs
# ONLY the Windows compile matrix: the Python suites are fully covered by
# push/PR/tag events, while compiling every day on pinned runner images is
# the drift detector for hosted-image toolchain changes (the images gain
# and lose preinstalled software over time, e.g. the VS2026 images ship
# without NSIS and without the v143 toolset).
on:
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      bootstrap-golden:
        description: 'regenerate tests/golden/golden-manifest.json from this build (then download the artifact and commit it)'
        required: false
        default: false
        type: boolean

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # full history: the whitespace gate diffs the pushed range
      # (before-sha to head), which a depth-1 checkout cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Zoom math regression tests
        run: python3 tests/zoom_math_test.py

      - name: Menu structure, dark mode wiring and version consistency tests
        run: python3 tests/menu_structure_test.py

      - name: Second-rework simulation tests (the 1.1.07 check)
        run: python3 tests/simulation_test.py

      - name: Pixel golden harness structure tests
        run: python3 tests/pixel_golden_test.py

      # the byte invariants: line endings, BOMs and final newlines per
      # file class. an editor tool has silently rewritten bytes in this
      # tree four recorded times; the class itself now answers in ci.
      - name: Byte invariant tests (line endings, BOMs, final newlines)
        run: python3 tests/byte_invariant_test.py

      # the whitespace gate: git's own diff --check over the pushed
      # range (the merge base for pull requests). catches trailing
      # whitespace and space-before-tab in added lines before they
      # ride a commit. the check set carries cr-at-eol on purpose:
      # the crlf sources are this tree's normal form and the byte
      # invariant suite owns that domain - a bare \r must not read
      # as trailing whitespace here.
      - name: Whitespace discipline (git diff --check over the pushed range)
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event_before }}" ] && git cat-file -e "${{ github.event_before }}" 2>/dev/null; then
            base="${{ github.event_before }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            echo "no comparable range for a ${{ github.event_name }} event - the check waits for a push or a pull request"
            exit 0
          fi
          WS="blank-at-eol,space-before-tab,blank-at-eof,cr-at-eol"
          if git -c core.whitespace="$WS" diff --check "$base" HEAD; then
            echo "whitespace clean over $base..HEAD"
          else
            echo "whitespace errors above - fix them before this can merge"
            exit 1
          fi

      # the vendored libwebp tree: the offline verifier proves the file
      # set, the version record and the include closure carry no drift.
      - name: Vendored libwebp closure check
        run: python3 tools/update_libwebp.py --check

      # the arm64 compile gate: viv_state.h has carried the
      # VERSION_ARM64 branch of the machine chain since the split,
      # and nothing ever compiled it. the zig cross build proves the
      # tree still translates and links for aarch64 windows on every
      # push; runtime verification for the target stays deferred (no
      # windows-arm64 runner rides the free tier) - this is the
      # compile half of that honesty.
      - name: ARM64 cross-compile gate (aarch64 windows, zig cc)
        run: |
          python3 -m pip install --quiet ziglang==0.16.0
          sh build-zig/build-arm64.sh

  # Compile both shipping configurations on every push (since rc.2), pull
  # request, tag and daily schedule so a build break is caught before
  # tagging a release.
  #
  # Runner matrix: windows-latest is in the middle of GitHub's gradual
  # migration to the Windows Server 2025 + VS2026 (v145) image, and the
  # 2025 image has no v143 toolset (MSB8020). Pin the shipping build to
  # windows-2022 (VS2022, v143) and pair it with windows-2025 (VS2026,
  # v145 via the vs2026 project) so the migration can not break this
  # repository's CI by surprise: the v145 leg doubles as the forward
  # compatibility / image drift detector.
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-2022 v143
            runner: windows-2022
            project: vs2019
            toolset: v143
          - name: windows-2025 v145
            runner: windows-2025
            project: vs2026
            toolset: v145
    runs-on: ${{ matrix.runner }}
    name: compile (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build x64 (Release)
        shell: cmd
        run: msbuild ${{ matrix.project }}\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ matrix.toolset }} "/p:OutDir=%GITHUB_WORKSPACE%\build\x64\\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x64\\" /m /nologo /v:m

      - name: Build x86 (Release)
        shell: cmd
        run: msbuild ${{ matrix.project }}\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=${{ matrix.toolset }} "/p:OutDir=%GITHUB_WORKSPACE%\build\x86\\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x86\\" /m /nologo /v:m

      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($p in @('build\x64\voidImageViewer.exe', 'build\x86\voidImageViewer.exe')) {
            if (!(Test-Path $p)) { throw "missing build output: $p" }
            Write-Host "== $p ==" (Get-Item $p).Length bytes
          }

      # the audit's binary-level baseline: the exe must carry the hardening
      # bits the project files claim (/guard:cf + /GUARD:CF and the dynamic
      # base / nx defaults). a flag that silently drops out of a project
      # file fails here, not on a user's machine - the same drift-detector
      # role the v145 leg plays for the toolchain.
      - name: PE security attributes (ASLR / DEP / CFG)
        shell: powershell
        # the exe list rides -Command with the call operator: a -File
        # command line delivers "a","b" as one joined string and the
        # [string[]] binding never splits it (the first ci run of this
        # step failed on exactly that).
        run: powershell -ExecutionPolicy Bypass -Command "& tools\pe_security_check.ps1 -ExePath 'build\x64\voidImageViewer.exe','build\x86\voidImageViewer.exe'"

      # the real machine smoke test from the 1.0.02 audit round never ran
      # automatically: every push now opens the full anomaly sample set
      # through the freshly compiled x64 exe on the windows-2022 runner
      # (a hosted windows runner is a real windows machine - gui launch,
      # exit codes and close all work). the samples generate inline when
      # the directory is missing (pure stdlib python, no extra deps).
      - name: Real machine smoke test (the anomaly sweep)
        if: matrix.runner == 'windows-2022'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\smoke_test.ps1 -ExePath "build\x64\voidImageViewer.exe" -SamplesDir "tests\samples"

      # the qoi fuzz smoke: the built-in decoder is the only format
      # with no system codec behind it, so its adversarial input
      # testing cannot lean on anyone else. thirty-six deterministic
      # mutants of the tracked qoi fixtures open through the hidden
      # export path; each must decode or refuse - a crash exit code
      # or a wedge past the kill timeout is the failure the stage
      # exists to catch.
      - name: QOI fuzz smoke (deterministic mutant corpus)
        if: matrix.runner == 'windows-2022'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\qoi_fuzz_smoke.ps1 -ExePath "build\x64\voidImageViewer.exe" -SamplesDir "tests\samples"

      # the pixel oracle: the hidden render export walks the real pipeline
      # and the golden hashes pin the exact pixels (the decode, the fit
      # math, the backdrop, the alpha flattening and each renderer's own
      # sampling). the strict comparison only runs once the manifest is
      # tracked - before the bootstrap it stays soft so the pre-golden
      # pushes stay green (the dispatch input regenerates the manifest
      # for a maintainer to commit; a deleted manifest cannot silently
      # downgrade the gate, the ls-files check answers the tracked state).
      - name: Pixel golden test (the bitmap hash oracle)
        if: matrix.runner == 'windows-2022'
        shell: powershell
        env:
          BOOTSTRAP_GOLDEN: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap-golden }}
        run: |
          $tracked = git ls-files tests/golden/golden-manifest.json
          if ($env:BOOTSTRAP_GOLDEN -eq 'true') {
            powershell -ExecutionPolicy Bypass -File tests\render_golden.ps1 -ExePath "build\x64\voidImageViewer.exe" -SamplesDir "tests\samples" -UpdateGolden
          } elseif ($tracked) {
            powershell -ExecutionPolicy Bypass -File tests\render_golden.ps1 -ExePath "build\x64\voidImageViewer.exe" -SamplesDir "tests\samples"
          } else {
            Write-Host "golden manifest not bootstrapped yet - the strict pixel comparison waits for the dispatch bootstrap (see the workflow inputs)"
          }

      - name: Upload the bootstrapped golden manifest
        if: matrix.runner == 'windows-2022' && github.event_name == 'workflow_dispatch' && inputs.bootstrap-golden
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-manifest
          path: tests/golden/golden-manifest.json
