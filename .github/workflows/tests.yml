name: tests

# Continuous verification of the zoom math, menu structure, dark mode wiring
# and localization alignment invariants. Runs on every push and every day
# (04:00 UTC = 12:00 Asia/Shanghai) so regressions are caught even when no
# one is actively working on the repository.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zoom math regression tests
        run: python3 tests/zoom_math_test.py

      - name: Menu structure, dark mode wiring and version consistency tests
        run: python3 tests/menu_structure_test.py

  # rc.2: compile both shipping configurations on every push, so a build
  # break is caught before tagging a release (previously only the tag
  # driven release workflow compiled).
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build x64 (Release)
        shell: cmd
        run: msbuild vs2019\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:OutDir=%GITHUB_WORKSPACE%\build\x64\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x64\" /m /nologo /v:m

      - name: Build x86 (Release)
        shell: cmd
        run: msbuild vs2019\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=%GITHUB_WORKSPACE%\build\x86\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x86\" /m /nologo /v:m

      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($p in @('build\x64\voidImageViewer.exe', 'build\x86\voidImageViewer.exe')) {
            if (!(Test-Path $p)) { throw "missing build output: $p" }
            Write-Host "== $p ==" (Get-Item $p).Length bytes
          }
