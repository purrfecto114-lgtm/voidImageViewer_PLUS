name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0-beta.1). Defaults to the pushed tag.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 (Release)
        shell: cmd
        run: msbuild vs2019\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:OutDir=%GITHUB_WORKSPACE%\build\x64\\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x64\\" /m /nologo /v:m

      - name: Build x86 (Release)
        shell: cmd
        run: msbuild vs2019\voidImageViewer.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=%GITHUB_WORKSPACE%\build\x86\\" "/p:IntDir=%GITHUB_WORKSPACE%\build\obj\x86\\" /m /nologo /v:m

      - name: Verify build output
        shell: pwsh
        run: |
          $errors = @()
          foreach ($p in @('build\x64\voidImageViewer.exe', 'build\x86\voidImageViewer.exe')) {
            if (!(Test-Path $p)) {
              $errors += "missing build output: $p"
              continue
            }
            Write-Host "== $p =="
            (Get-Item $p).VersionInfo | Format-List FileVersion, ProductVersion, FileDescription | Out-Host
            if ((Get-Item $p).VersionInfo.FileVersion -notmatch '\d+') {
              $errors += "no version info in $p"
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }

      - name: Build installers (NSIS)
        shell: pwsh
        run: |
          # locate makensis (preinstalled on the hosted images, choco fallback)
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            if (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') {
              $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
            } else {
              Write-Host 'installing nsis via choco...'
              choco install nsis -y --no-progress
              $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
            }
          }
          Write-Host "makensis: $makensis"

          # validate the encodings required by the bilingual installer files
          & powershell -ExecutionPolicy Bypass -File nsis\ensure_encodings.ps1

          # the unified bilingual installer: the language is selected inside the setup.
          & $makensis "-DVIV_EXE_DIR=$env:GITHUB_WORKSPACE\build\x64" '-Dx64' nsis\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'x64 installer build failed' }

          & $makensis "-DVIV_EXE_DIR=$env:GITHUB_WORKSPACE\build\x86" nsis\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'x86 installer build failed' }

          # makensis writes the output relative to the script directory (nsis\)
          $errors = @()
          foreach ($f in @('nsis\voidImageViewer-*-x64-Setup.exe', 'nsis\voidImageViewer-*-x86-Setup.exe')) {
            if (!(Get-ChildItem $f -ErrorAction SilentlyContinue)) { $errors += "missing installer: $f" }
          }
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
          Get-ChildItem nsis\*Setup.exe | Out-Host


      - name: Determine tag and version
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $version = $tag.TrimStart('v')
          # derive the release phase label from the version string:
          # 1.1.0-rc.1 -> " (RC)", 1.1.0-beta.9 -> " (BETA)", 1.1.0 -> ""
          $phase = if ($version -match '-rc\.') { ' (RC)' } elseif ($version -match '-beta\.') { ' (BETA)' } else { '' }
          "tag=$tag" | Add-Content -Path $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "phase=$phase" | Add-Content -Path $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$version phase=$phase"

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $x64zip = "voidImageViewer-$version-x64.zip"
          $x86zip = "voidImageViewer-$version-x86.zip"
          Compress-Archive -Path 'build\x64\voidImageViewer.exe', 'LICENSE' -DestinationPath $x64zip
          Compress-Archive -Path 'build\x86\voidImageViewer.exe', 'LICENSE' -DestinationPath $x86zip
          if (!(Test-Path $x64zip) -or !(Test-Path $x86zip)) { throw 'packaging failed' }
          # rename the installers to include the release version (built into nsis\)
          Move-Item "nsis\voidImageViewer-*-x64-Setup.exe" "voidImageViewer-$version-x64-Setup.exe" -Force
          Move-Item "nsis\voidImageViewer-*-x86-Setup.exe" "voidImageViewer-$version-x86-Setup.exe" -Force
          if (!(Test-Path "voidImageViewer-$version-x64-Setup.exe")) { throw 'x64 setup missing' }
          if (!(Test-Path "voidImageViewer-$version-x86-Setup.exe")) { throw 'x86 setup missing' }
          Get-ChildItem *.zip, *Setup.exe | Out-Host

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          # voidImageViewer $VERSION - Touch, Zoom & Languages$PHASE

          > **Pre-release**: this is an experimental fork of voidtools/voidImageViewer adding touch optimizations, on-screen zoom controls and a bilingual installer with a UI language switcher. Feedback is welcome in the issue tracker.

          ## Recent changes

          - **1.1.0-rc.3** - second review pass, every re-review claim re-verified against evidence: a gesture id claim rejected with winuser.h proof (GID_TWOFINGERTAP is 6), WebP transposed-EXIF dimensions fixed to match the rotated bitmap, quoted uninstall string bounded, jump-to dialog re-posts a swallowed WM_QUIT, zero file drops no longer clear the playlist, first frame count clamp
          - **1.1.0-rc.2** - review fixes: touch gestures are actually enabled now (SetGestureConfig wrapper bug), the app registers in add/remove programs (the real fix for the installed list), security hardening (bounded copies, validated IPC, clipboard size checks), WebP transparency honors the backdrop, zero delay frame stall fix, mipmap axis fix
          - **1.1.0-rc.1** - zoom buttons step whole 10 percents (a non multiple first snaps to the nearest multiple of 10), the zoom percent is always visible in the status bar and clicking it opens an exact percent dialog, dark dialogs now actually paint dark (a beta.10 placement bug), translations aligned 254/254
          - **1.1.0-beta.13** - startup crash fix (bad gdi+ export name), right click menu regrouped (zoom submenu, trimmed slideshow rates, paste with copy), clipboard image paste
          - **1.1.0-beta.12** - zoom stall fix around the half size mipmap, progressive first frame from the embedded exif thumbnail
          - **1.1.0-beta.11** - transparent image backdrop (checkerboard, custom color), installer language dialog fix, machine universality alignment with upstream

          See `Changes.txt` in the repository for the full history.

          ## What's new

          ### 1.1.0-beta.2 - installer & languages

          - Single bilingual setup: pick **English or 简体中文** on the first page (all pages, messages and the license are localized)
          - The setup language is remembered and forwarded to the application
          - New **Options → General → Language** setting (Auto / English / 简体中文), applied immediately
          - `language` ini setting and `/language auto|english|chinese` command line option
          - Refreshed, plain Simplified Chinese translation for the whole UI including Explorer file type descriptions
          - The setup offers to run void Image Viewer when it finishes and now installs Changes.txt too

          ### 1.1.0-beta.1 - touch & zoom controls

          - Pinch to zoom (anchored at the finger center, same zoom steps as the mouse wheel)
          - Two finger pan with inertia
          - Two finger tap to reset the zoom
          - Double tap to toggle 1:1 / best fit
          - Single finger touch keeps mouse semantics (all click actions unaffected)
          - Zoom in / zoom out buttons on the toolbar
          - Floating zoom controls (zoom out, zoom in, 1:1, best fit) — also available in fullscreen
          - View -> Zoom Controls menu setting (`show_zoom_controls` ini setting, default on for touch devices)
          - Enlarged toolbar buttons and icons on touch devices

          ## Downloads

          | File | Platform |
          |---|---|
          | voidImageViewer-$VERSION-x64-Setup.exe | 64-bit installer (English + 简体中文) |
          | voidImageViewer-$VERSION-x86-Setup.exe | 32-bit installer (English + 简体中文) |
          | voidImageViewer-$VERSION-x64.zip | 64-bit portable zip |
          | voidImageViewer-$VERSION-x86.zip | 32-bit portable zip |

          Requires Windows 7 or later. Gestures require touch hardware.

          Based on upstream voidtools/voidImageViewer 1.0.0.15 (MIT license).
          '@.Replace('$VERSION', '${{ steps.tag.outputs.version }}').Replace('$PHASE', '${{ steps.tag.outputs.phase }}') | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create or update pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $version = '${{ steps.tag.outputs.version }}'
          $title = "voidImageViewer $version - Touch, Zoom & Languages${{ steps.tag.outputs.phase }}"
          $prerelease = '${{ inputs.prerelease }}'
          if (-not $prerelease) { $prerelease = 'true' }
          $isPre = $prerelease -ne 'false'
          $assets = @(
            "voidImageViewer-$version-x64-Setup.exe",
            "voidImageViewer-$version-x86-Setup.exe",
            "voidImageViewer-$version-x64.zip",
            "voidImageViewer-$version-x86.zip"
          )

          gh release view $tag 2> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists, updating..."
            gh release upload $tag @assets --clobber
            gh release edit $tag --title $title --notes-file release-notes.md --draft=false
            if ($isPre) { gh release edit $tag --prerelease } else { gh release edit $tag --prerelease=false }
          } else {
            Write-Host "creating release $tag..."
            gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file release-notes.md
            if ($isPre) { gh release edit $tag --prerelease }
          }
          gh release view $tag | Out-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidImageViewer-${{ steps.tag.outputs.version }}
          path: |
            build/x64/voidImageViewer.exe
            build/x86/voidImageViewer.exe
            voidImageViewer-*-Setup.exe
            nsis/voidImageViewer-*-Setup.exe
          if-no-files-found: error
